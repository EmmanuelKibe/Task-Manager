{% extends 'todos/base.html' %}

{% block content %}
<h2>Task Manager</h2>

<form method="POST" style="margin-bottom: 20px;">
    {% csrf_token %}
    <input type="text" name="title" class="form-control" placeholder="Add a new task..." required>
    <button type="submit" class="btn btn-add">Add</button>
</form>

<div>
    {% for task in tasks %}
        <div class="task-item">
            <form method="POST" action="{% url 'toggle_task' task.id %}" style="display: flex; align-items: center;">
                {% csrf_token %}
                <input type="checkbox" onChange="this.form.submit()" {% if task.completed %}checked{% endif %}>
                <span class="{% if task.completed %}completed{% endif %}" style="margin-left: 10px;">
                    {{ task.title }}
                </span>
            </form>
            <form method="POST" action="{% url 'delete_task' task.id %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-delete">Delete</button>
            </form>
        </div>
    {% empty %}
        <p>No tasks yet. Create one above!</p>
    {% endfor %}
</div>
{% endblock %}
